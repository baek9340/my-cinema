<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어둠 속에서 빛나는 색</title>
<style>
@font-face{font-family:"INT";src:url("fonts/Inter-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"INT";src:url("fonts/Inter-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"INT";src:url("fonts/Inter-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"PTD";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 930;font-display:swap}

/* v2 — 첫 화면은 flim.ai식 분할 화면(포인트 컬러 패널 + 검은 원 + 큰 제목), 아래는 A24 시스템(따뜻한 흰 바탕 · 모서리 0 · 1px 선) */
:root{
  --bg:#fcfbfa; --n50:#f2f0ed; --n100:#e8e6e2; --n200:#d6d4d1; --mute:#9c9791; --ink:#0e0e0d; --dk:#141414;
  --sans:"INT","PTD",system-ui,sans-serif; --mono:"INT","PTD",system-ui,sans-serif;
  --expo:cubic-bezier(.19,1,.22,1); --pad:clamp(16px,2.2vw,32px);
  --pt:#fcaa37; --pt-ink:#0e0e0d; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,p{margin:0;text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--mono);font-size:10px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;padding:8px 10px 7px;font:500 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;transition:background .25s,color .25s}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 머리 */
header{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:grid;grid-template-columns:auto 1fr auto;column-gap:clamp(16px,2.4vw,36px);align-items:center;padding:0 var(--pad);color:var(--ink);background:none;transition:color .4s}
header.dark{color:#fff}
header nav{display:flex;gap:clamp(12px,1.7vw,26px);white-space:nowrap}
@media (max-width:1380px){header nav{gap:12px;font-size:9px}header nav a::before{margin-right:5px}}
@media (max-width:1180px){header nav{display:none}}
header a{text-decoration:none}
header nav a::before{content:"";display:inline-block;width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:8px;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s}
header nav a:hover::before,header nav a[aria-current="true"]::before{opacity:1;transform:none}
header .mark{font:700 19px/1 var(--sans);letter-spacing:-.04em;white-space:nowrap}
header .mark{order:-1}
header nav{justify-self:start}
header .r{justify-self:end;display:flex;gap:10px;align-items:center}
header .r b{font:inherit;background:var(--ink);color:#fff;padding:7px 9px 6px}
header.dark .r b{background:#fff;color:#000}

/* ── 첫 화면: 흰 패널이 걷히며 장면이 열린다 (스크롤 연동) ── */
.hero{position:relative;height:100vh;background:#0e0e0d}
html{scroll-snap-type:y proximity}
.hero,.up,.dn{scroll-snap-align:start}
.htop,.htxt{transition:transform 1.1s var(--expo)}
.hero.open .htop{transform:translate3d(0,-100%,0)}
.hero.open .htxt{transform:translate3d(0,-50%,0)}
.himgs{transition:transform 1.4s var(--expo)}
.hero.open .himgs{transform:none}
.stick{position:sticky;top:0;height:100vh;overflow:hidden}
.htop{position:absolute;left:0;top:0;width:100%;height:70vh;z-index:10;background:#0e0e0d;color:#fff;padding-top:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;will-change:transform}
.htxt{display:flex;flex-direction:column;align-items:center;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.hero.go .enjoy{opacity:1}
.hsm,.hbig{display:block;overflow:hidden;white-space:nowrap}
.hsm{font:500 clamp(18px,2vw,30px)/1.15 var(--sans);letter-spacing:-.01em;text-transform:uppercase}
.hbig{font:700 clamp(56px,11.5vw,200px)/.95 var(--sans);letter-spacing:-.045em;padding-bottom:.06em;text-transform:uppercase}
.hsm i,.hbig i{display:inline-block;font-style:normal;transform:translateY(105%);transition:transform 1.1s var(--expo)}
.hero.go .hsm i,.hero.go .hbig i{transform:none}
.hsub{margin-top:clamp(14px,1.6vw,22px);font:400 11px/1.7 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.hsub span{display:block;overflow:hidden}
.hsub span i{display:block;font-style:normal;transform:translateY(250%) rotate(5deg);transform-origin:0 50%;transition:transform 1.1s var(--expo)}
.hero.go .hsub span i{transform:none}
.enjoy{position:absolute;left:var(--pad);bottom:18px;display:flex;align-items:center;gap:10px;font:500 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity 1s .8s}
.enjoy b{display:inline-block;width:18px;height:18px;border:1px solid currentColor;border-radius:50%;position:relative}
.enjoy b::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:currentColor;border-radius:50%;animation:dn 1.6s var(--expo) infinite}
@keyframes dn{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}100%{transform:translateY(5px);opacity:0}}
.hbot{position:absolute;inset:0;opacity:0;transform:translateY(10%);transition:opacity 2.8s var(--expo),transform 2.8s var(--expo)}
.hero.go .hbot{opacity:1;transform:none}
.himgs{position:absolute;inset:0;overflow:hidden;transform-origin:50% 100%;will-change:transform;transform:translate3d(0,30%,0) scale(1.25);background:#000}
.hscene{position:absolute;inset:0;opacity:0;transition:opacity .55s var(--expo)}
.hscene.on{opacity:1}
.hscene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(4px);transform:scale(1.04)}
.hscene::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.72)}
.hchips{position:absolute;right:var(--pad);top:50%;z-index:3;display:flex;flex-direction:column;gap:6px;width:min(36vw,480px);transform:translateY(-50%)}
.hchip{width:100%;height:clamp(64px,13vh,112px);padding:14px 16px;display:flex;flex-direction:row;align-items:flex-end;justify-content:space-between;font:500 11px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase;will-change:transform;transform:translate3d(60vw,0,0);cursor:pointer;text-align:left}
.hchip b{font-weight:700}
.hchip span:last-child{font-size:12px;letter-spacing:.02em}
.hcap{position:absolute;left:var(--pad);bottom:calc(var(--pad) * 1.4);max-width:48vw;z-index:3;color:#fff;font:500 12px/1.6 var(--sans);letter-spacing:.02em;text-transform:uppercase;opacity:0;transition:opacity .6s}
.hcap b{display:block;margin-bottom:10px;font:500 clamp(28px,3.6vw,56px)/1.05 var(--sans);letter-spacing:-.03em;text-transform:none}
.hnav{position:absolute;right:var(--pad);bottom:calc(var(--pad) * 1.4);z-index:4;display:flex;gap:14px;color:#fff;font:500 11px/1 var(--sans);letter-spacing:.04em}
.hnav button{opacity:.55;padding:4px 0;border-bottom:1px solid transparent;transition:opacity .25s}
.hnav button:hover,.hnav button[aria-current="true"]{opacity:1;border-color:#fff}
.hq{position:absolute;left:var(--pad);bottom:calc(var(--pad) * 1.4);z-index:3;color:#fff;max-width:min(40ch,60%);font:500 clamp(15px,1.5vw,22px)/1.3 var(--sans);text-transform:none}
.hq small{display:block;margin-top:4px;font:400 clamp(12px,1vw,14px)/1.35 var(--sans);opacity:.8}
.hero.static{height:auto}.hero.static .stick{position:relative;height:auto}
.hero.static .htop{position:relative;height:auto;padding:90px 0 60px}
.hero.static .hbot{position:relative;height:70vh;opacity:1;transform:none}.hero.static 

/* 색인 */

/* 영화 한 편 */
.film{position:relative}
.screen{position:relative;height:100vh;min-height:560px;overflow:hidden;background:#000;color:#fff}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 2.4s var(--expo),opacity 1s;opacity:0}
.film.in .screen img{transform:none;opacity:1}
.screen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 32%,transparent 52%,rgba(0,0,0,.5))}
.screen .lab{position:absolute;left:var(--pad);right:var(--pad);top:76px;z-index:2;display:flex;justify-content:space-between;gap:14px}
.screen .lab div{display:flex;gap:14px}
.screen h2{position:absolute;left:var(--pad);right:var(--pad);top:108px;z-index:2;font:500 clamp(56px,11vw,190px)/.9 var(--sans);letter-spacing:-.045em}
.screen h2 .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.screen h2 .w{display:inline-block;transform:translateY(105%);transition:transform 1.3s var(--expo)}
.film.in .screen h2 .w{transform:none}
.screen .yr{position:absolute;right:var(--pad);bottom:calc(var(--pad) * 1.2);z-index:2;font:500 clamp(48px,9vw,150px)/.8 var(--sans);letter-spacing:-.06em;opacity:0;transition:opacity 1s .8s}
.film.in .screen .yr{opacity:1}
.screen .subt{position:absolute;left:var(--pad);bottom:calc(var(--pad) * 1.2);z-index:2;max-width:min(46ch,52%);font:500 clamp(16px,1.7vw,26px)/1.35 var(--sans);opacity:0;transform:translateY(10px);transition:opacity 1s .9s,transform 1.2s .9s var(--expo)}
.screen .subt small{display:block;font:400 clamp(13px,1.1vw,16px)/1.35 var(--sans);margin-top:6px;opacity:.9}
.screen .subt .by{display:block;margin-top:9px;opacity:.75}
.film.in .screen .subt{opacity:1;transform:none}
.screen .miss{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute)}
.film.nostill .screen .miss{display:flex}
.film.nostill .screen img{display:none}

/* 아래 배색 영역 — 왼쪽: 포스터 + 정보 + 글 / 오른쪽: 컬러칩 (스크롤 동안 고정) */
.pal{display:grid;grid-template-columns:minmax(280px,1fr) 1.7fr;border-bottom:1px solid var(--n100)}
.pal .l{padding:calc(var(--pad) + 20px) var(--pad) calc(var(--pad) * 2);border-right:1px solid var(--n100);display:flex;flex-direction:column;gap:calc(var(--pad) * 1.3)}
.poster{margin:0;overflow:hidden;background:var(--n50)}
.poster img{display:block;width:100%;height:auto;opacity:0;transform:scale(1.06);transition:opacity 1s var(--expo),transform 1.8s var(--expo)}
.film.in .poster img{opacity:1;transform:none}
.pal .r .stk{position:sticky;top:76px}
.info{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--ink)}
.info dt,.info dd{margin:0;padding:10px 0;border-bottom:1px solid var(--n100);display:flex;align-items:center;min-height:40px}
.info dt{color:var(--ink);font-weight:700;padding-right:22px}
.info dd{font:500 15px/1.25 var(--sans);justify-content:flex-end;text-align:right}
.info dd .dot{display:inline-block;width:12px;height:12px;border-radius:0;margin-right:8px;flex:none;border:1px solid rgba(0,0,0,.12)}
.pal .r{padding:calc(var(--pad) + 20px) var(--pad) var(--pad)}
.tonebox{padding:0}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,36px)}
.tg .mono,.sp2 .mono,.pts>.mono,.area-t,.say .k{display:block;margin-bottom:12px;font:700 10px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.tg .mono em,.sp2 .mono em{font-style:normal;color:var(--mute)}
.sws{display:flex;gap:2px;height:clamp(46px,5vw,72px)}
.sws button{flex:1;position:relative;transform:scaleY(.2);transform-origin:50% 100%;opacity:0;transition:transform .9s var(--expo),opacity .4s}
.film.in .sws button{transform:none;opacity:1}
.sws button:hover{transform:scaleY(1.12);z-index:2}
.sp2{margin-top:clamp(18px,2.4vw,34px)}
.sp2 .sws{height:clamp(52px,5.6vw,84px)}
.read{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:22px;color:var(--mute)}
.read i{display:inline-block;width:22px;height:22px;border:1px solid rgba(0,0,0,.1)}
.read b{font:500 15px/1 var(--sans);color:var(--ink);letter-spacing:0}
.pts{display:flex;flex-wrap:wrap;column-gap:2px;row-gap:0;width:100%;margin-top:calc(var(--pad) * 1.2)}
.pts>.mono{width:100%}
.pts button{flex:0 1 calc((100% - 8px) / 5);min-width:0;text-align:left}
.pts span{display:block;aspect-ratio:1.9;border-radius:0;transform:scale(.6);opacity:0;transition:transform .9s .4s var(--expo),opacity .5s .4s}
.film.in .pts span{transform:none;opacity:1}
.pts b{display:block;margin-top:8px;font:500 14px/1 var(--sans)}
.pts small{display:block;margin-top:4px;color:var(--mute)}
.area{display:flex;height:10px;margin-top:calc(var(--pad) * 1.2)}
.area i{height:100%;width:0;transition:width 1.4s var(--expo)}
.film.in .area i{width:var(--w)}
.say{display:grid;grid-template-columns:1fr;gap:calc(var(--pad) * 1.2)}
.say p{font:400 clamp(16px,1.25vw,19px)/1.5 var(--sans);white-space:pre-line}
.acts{margin-top:var(--pad)}

/* 상영 후 */
footer{background:#000;color:var(--mute);display:flex;justify-content:space-between;gap:20px;padding:18px var(--pad);border-top:1px solid #222}

.lb{position:fixed;inset:0;z-index:100;background:rgba(252,251,250,.98);display:none;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:4vw;align-items:center;padding:5vh 5vw}
.lb.open{display:grid;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.lb img{max-height:88vh;max-width:100%;justify-self:center;box-shadow:0 40px 70px -40px rgba(14,14,13,.5)}
.lb h3{font:500 40px/1 var(--sans);letter-spacing:-.03em}
.lb p{margin-top:12px;white-space:pre-line}
.lb .ctl{display:flex;gap:8px;margin-top:22px}
.lb .x{position:absolute;right:var(--pad);top:16px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s var(--expo),transform 1.2s var(--expo)}
.rv.in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;font:400 11px/1 var(--mono);text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--expo);z-index:120}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ── 영화 한 편 = 두 페이지 ── */
.pg{position:relative;overflow:hidden;color:#fff}
.up{min-height:100vh}
.pg .k{display:inline-block;font:700 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
/* 상위 페이지: 영화 색 그라데이션 + 큰 제목 + 줄거리 + 정보 / 오른쪽 포스터 */
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%)}
.up::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 60%);pointer-events:none}
.upl{position:relative;padding:84px clamp(24px,5vw,88px) clamp(28px,5vh,56px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.up .lab{display:flex;gap:16px;opacity:.75;margin-bottom:clamp(14px,2.2vh,26px)}
.up h2{font:400 clamp(40px,min(5vw,9vh),104px)/1.02 var(--sans);letter-spacing:-.045em}
.up h2 .m{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.up h2 .w{display:inline-block;transform:translateY(105%);transition:transform 1.3s var(--expo)}
.pg.in h2 .w{transform:none}
.up .en{margin-top:10px;font:500 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.up .k{margin:clamp(16px,2.8vh,38px) 0 10px}
.story{max-width:50ch;font:400 clamp(14px,1.05vw,16px)/1.62 var(--sans);white-space:pre-line;opacity:.72}
.meta{margin:clamp(18px,3.4vh,48px) 0 0;display:grid;grid-template-columns:repeat(2,max-content);column-gap:clamp(36px,7vw,120px);row-gap:clamp(16px,2.6vh,26px)}
.meta dt{margin-bottom:9px}
.meta dd{margin:0;display:flex;align-items:center;gap:8px;font:400 clamp(15px,1.25vw,19px)/1.25 var(--sans)}
.meta dd i{display:inline-block;width:12px;height:12px;border:1px solid rgba(255,255,255,.55)}
.upl>*{opacity:0;transform:translateY(16px);transition:opacity 1s var(--expo),transform 1.2s var(--expo)}
.upl>h2{opacity:1;transform:none}
.pg.in .upl>*{opacity:1;transform:none}
.pg.in .upl>.story{opacity:.72}
.pg.in .upl>.k,.pg.in .upl>.story{transition-delay:.25s}.pg.in .upl>.meta{transition-delay:.45s}
.upr{position:relative;margin:0;width:min(46vw,71vh);min-height:100vh;background:rgba(0,0,0,.2)}
.upr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.2s var(--expo),transform 2s var(--expo)}
.pg.in .upr img{opacity:1;transform:none}
/* 하위 페이지: 장면을 깔고 위엔 밝기별 색, 가운데엔 MAIN 컬러 원, 아래엔 스펙트럼 */
.dn{background:var(--g0);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.dn .sws button{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dn .btn:hover{background:#fff;color:#0e0e0d;border-color:#fff}
.dn{min-height:100vh}
.dnw{position:relative;min-height:100vh;padding:84px clamp(24px,5vw,88px) clamp(32px,6vh,60px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,56px)}
.col{display:flex;flex-direction:column;min-height:0}
.col .k{align-self:flex-start;margin-bottom:10px}
.c1{gap:clamp(16px,3vh,32px)}
.c1>div{flex:1;display:flex;flex-direction:column;min-height:0}
.dn .c1 .sws{flex:1;height:auto}
.ptl{flex:1;display:flex;flex-direction:column;gap:4px}
.pti{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 14px;font:700 12px/1 var(--sans);letter-spacing:.04em;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transform:scaleX(.25);transform-origin:0 50%;opacity:0;transition:transform 1s var(--expo),opacity .6s}
.pg.in .pti{transform:none;opacity:1}
.pti small{font:400 12px/1 var(--sans);opacity:.8}
.dn .vsp{flex:1;height:auto;flex-direction:column;gap:2px}
.vsp button{transform:scaleX(.2);transform-origin:0 50%}
.vsp button:hover{transform:scaleX(1.03)}
.c3 .btn{margin-top:16px;align-self:flex-start}
.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,52px)}
.tones .k,.cast-w .k,.spec .k{margin-bottom:10px}
.dn .sws{height:clamp(40px,7vh,72px)}
.pg.in .sws button{transform:none;opacity:1}
.cast{display:flex;flex-wrap:wrap;gap:clamp(22px,4.6vw,76px)}
.cast button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.cast span{display:block;width:clamp(84px,min(11vw,20vh),168px);aspect-ratio:1;border-radius:0;border:1px solid rgba(255,255,255,.2);transform:scale(.55);opacity:0;transition:transform 1s var(--expo),opacity .6s}
.pg.in .cast span{transform:none;opacity:1}
.cast button:hover span{transform:scale(1.06)}
.cast b{margin-top:10px;font:700 12px/1 var(--sans);letter-spacing:.04em}
.cast small{margin-top:7px;font:400 12px/1 var(--sans);opacity:.75}
.spec .sws{height:clamp(32px,5vh,52px)}
.dnb{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.dnb .spec{flex:1;min-width:0}


/* 색 묶음별 한 화면씩 — 스크롤하면 글이 넘어가고 컬러칩이 나온다 */
.pg.seq{position:relative;overflow:visible;min-height:0;background:var(--g0);color:#fff}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;z-index:1}
.snap{position:absolute;left:0;width:1px;height:100vh;scroll-snap-align:start;pointer-events:none}
.st{position:absolute;inset:0;padding:84px clamp(24px,5vw,88px) clamp(40px,7vh,72px);display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(28px,5vw,96px);align-items:center;pointer-events:none}
.st.on{pointer-events:auto}
.st.flip{grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr)}
.st.flip .tx{order:2;align-items:flex-end;text-align:right}
.tx{display:flex;flex-direction:column;align-items:flex-start}
.tx>*{opacity:0;transform:translateY(48px);transition:opacity .6s var(--expo),transform .9s var(--expo)}
.st.past .tx>*{transform:translateY(-48px)}
.st.on .tx>*{opacity:1;transform:none}
.st.on .tx>:nth-child(2){transition-delay:.06s}.st.on .tx>:nth-child(3){transition-delay:.12s}.st.on .tx>:nth-child(4){transition-delay:.18s}.st.on .tx>:nth-child(5){transition-delay:.24s}
.tx .lab2{font:500 11px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:clamp(14px,2.4vh,24px)}
.tx h3{font:700 clamp(52px,6.6vw,120px)/.9 var(--sans);letter-spacing:-.045em;text-transform:uppercase;white-space:pre-line}
.tx .sub{margin-top:clamp(14px,2.2vh,22px);font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.tx p{margin-top:clamp(14px,2.2vh,22px);max-width:36ch;font:400 clamp(14px,1.05vw,16px)/1.65 var(--sans);color:rgba(255,255,255,.72)}
.tx .btn{margin-top:clamp(18px,3vh,30px)}
.tx .btn:hover{background:#fff;color:#0e0e0d;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:clamp(10px,1.2vw,18px) clamp(8px,1vw,14px);align-content:center}
.tile{display:flex;flex-direction:column;text-align:left;opacity:0;transform:translateY(28px) scale(.94);transition:opacity .5s var(--expo),transform .9s var(--expo)}
.st.on .tile{opacity:1;transform:none}
.tile i{position:relative;display:block;aspect-ratio:var(--ar,1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tile i em{position:absolute;right:8px;bottom:7px;font:700 11px/1 var(--sans);font-style:normal;letter-spacing:.02em}
.tile b{margin-top:8px;font:700 11px/1 var(--sans);letter-spacing:.04em}
.tile:hover i{outline:1px solid #fff;outline-offset:2px}
.bars{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);height:min(100%,64vh)}
.bar{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font:700 12px/1 var(--sans);letter-spacing:.04em;transform:scaleX(.2);transform-origin:0 50%;opacity:0;transition:transform 1s var(--expo),opacity .5s}
.st.on .bar{transform:none;opacity:1}
.bar small{font:400 12px/1 var(--sans);opacity:.8}
.pgn{position:absolute;bottom:clamp(14px,2.4vh,22px);font:500 11px/1 var(--sans);letter-spacing:.06em;opacity:0;transition:opacity .5s}
.st.on .pgn{opacity:.55}
.pgn.l{left:clamp(24px,5vw,88px)}.pgn.r{right:clamp(24px,5vw,88px)}

@media (max-width:900px){
  .st,.st.flip{grid-template-columns:1fr;align-content:center;gap:24px}.st.flip .tx{order:0;align-items:flex-start;text-align:left}
  .tx h3{font-size:clamp(40px,12vw,64px)}.tx p{display:none}.grid{--c:4!important}.bars{height:46vh}
  .up{grid-template-columns:1fr}.upr{width:100%;min-height:0;aspect-ratio:.72}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dnw{grid-template-columns:1fr}.dn .c1 .sws{flex:none;height:48px}.pti{min-height:64px}.dn .vsp{min-height:420px}
  header nav{display:none} header .r span{display:none}
  .htop{height:62vh}.hbig{font-size:clamp(40px,13vw,90px)}
  .hchips{left:5vw;right:5vw;width:auto;top:44%}.hchip{height:9vh}.hcap{max-width:none;right:var(--pad);bottom:76px}.hq{bottom:60px}
  header .mark{font-size:15px}
  .pal{grid-template-columns:1fr}
  .pal .l{border-right:0;border-bottom:1px solid var(--n100)}
  .pal .r .stk{position:static}
  .tg{grid-template-columns:1fr}.pts{width:100%}
  .say{grid-template-columns:1fr}
  .screen{height:78vh}.screen .subt{max-width:none;right:var(--pad);bottom:calc(var(--pad) * 3.4)}.screen .yr{font-size:44px}
  .lb{grid-template-columns:1fr;overflow:auto;align-content:start}.lb img{max-height:62vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.screen h2 .w{transform:none}.hsm i,.hbig i,.hsub span i{transform:none}.sws button,.pts span{opacity:1;transform:none}.area i{width:var(--w)}.screen img{opacity:1;transform:none}.up h2 .w,.upl>*,.upr img,.cast span{opacity:1;transform:none}}
</style>

<script>
(() => {
const D = JSON.parse(document.getElementById('cinema').textContent);
const F = (D.films || []).slice(0, 5);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => esc(s).replace(/\\n|\n/g, '<br>');
const pc = (p, d) => (+p * 100).toFixed(d) + '%';
const pad2 = n => String(n).padStart(2, '0');
const nm = f => f.title || ('Film ' + f.no);
const NOW = new Date().getFullYear();
const dash = v => v || '—';

// 색 도우미
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const inkOn = h => lum(h) > .36 ? '#0e0e0d' : '#ffffff';
const sat = h => { const [r, g, b] = rgb(h).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx ? (mx - mn) / mx : 0; };
const pt = f => f.point || ((f.accent || [])[0] || {}).hex || ((f.main || []).slice().sort((a, b) => sat(b.hex) - sat(a.hex))[0] || {}).hex || '#fcaa37';
// tone이 없으면 main · accent로 대신 그린다
const tone = f => {
  if (f.tone && f.tone.spectrum && f.tone.spectrum.length) return f.tone;
  const all = (f.main || []).concat(f.accent || []).slice().sort((a, b) => lum(b.hex) - lum(a.hex));
  const n = Math.max(1, Math.ceil(all.length / 3));
  return {light: all.slice(0, n).reverse(), medium: all.slice(n, 2 * n), dark: all.slice(2 * n).reverse(), spectrum: all};
};
const spec = (arr, cls) => `<div class="${cls}">${arr.map(c => `<i style="background:${esc(c.hex)}"></i>`).join('')}</div>`;
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1600); };

// 머리
const years = F.map(f => +f.year).filter(Boolean);
document.title = (D.title || '극장').replace(/\n/g, ' ');
$('mark').textContent = (D.name || D.author || '') ? (D.name || D.author) + '의 Cinema' : 'Cinema';
$('gnb').innerHTML = F.map(f => `<a href="#f${esc(f.no)}">${esc(f.titleEn || nm(f))}</a>`).join('');
$('cnt').textContent = pad2(F.length) + ' films';
$('yrs').textContent = years.length ? Math.min(...years) + '–' + Math.max(...years) : '';

// ── 첫 화면: 흰 패널이 걷히며 장면 다섯 칸이 열린다 ──
const hero = $('top');
const words = t => esc(t).split(/\\n|\n/).map(line => `<span class="m">${line.split(/(\s+)/).filter(w => w.trim()).map(w => `<span class="w">${w}</span>`).join(' ')}</span>`).join('');
const chars = (t, step, d0) => esc(t).split('').map((c, i) => `<i style="transition-delay:${(d0 + i * step).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</i>`).join('');
const bigT = String(D.title || '').replace(/\\n|\n/g, ' ');
$('htxt').innerHTML = `<span class="hsm">${chars(bigT, .05, .5)}</span><h1 class="hbig">${chars(D.subtitle || '', .1, 0)}</h1>`;
// 영화 다섯 편이 차례로: 장면이 바뀌고, 그 영화의 컬러칩 네 장이 왼쪽에서 들어왔다 오른쪽으로 나간다
const NF = F.length;
$('himgs').innerHTML = `${F.map((f, i) => `<div class="hscene" data-i="${i}"><img src="${esc(f.still)}" alt="${esc(nm(f))} 장면" onerror="this.remove()"></div>`).join('')}
  <div class="hchips" id="hchips">${['Light', 'Medium', 'Dark', 'Point'].map(k => `<div class="hchip" data-hex="" title="누르면 복사"><b>${k}</b><span></span></div>`).join('')}</div>
  <div class="hcap" id="hcap"></div><p class="hq" id="hq"></p>
  <div class="hnav" id="hnav">${F.map((f, i) => `<button data-i="${i}" aria-label="${esc(f.no)} ${esc(nm(f))}">${esc(f.no)}</button>`).join('')}</div>`;
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
if (still) hero.classList.add('static');
const imgs = $('himgs'), htop = $('htop'), htxt = $('htxt'), hcap = $('hcap'), hq = $('hq');
const chips = [...document.querySelectorAll('.hchip')], scenes = [...document.querySelectorAll('.hscene')], navb = [...document.querySelectorAll('#hnav button')];
const midc = (a, d) => a[Math.floor(a.length / 2)] || {hex: d};
let shown = -1;
function setFilm(i){
  if (i === shown) return; shown = i;
  const f = F[i], T = tone(f), p = pt(f);
  const cs = [midc(T.light, p), midc(T.medium, p), midc(T.dark, p), {hex: p}];
  chips.forEach((c, k) => { const h = cs[k].hex; c.dataset.hex = h; c.style.background = h; c.style.color = inkOn(h); c.title = h + ' · 누르면 복사'; c.querySelector('span').textContent = h.toUpperCase(); });
  hcap.innerHTML = `<b>${esc(nm(f))}</b>${esc(dash(f.year))} · ${esc(dash(f.director))}<br>${esc(f.no)} / ${pad2(NF)}`;
  const q = f.quote && f.quote.text ? f.quote : null;
  hq.innerHTML = q ? `${br(q.text)}${q.tr ? `<small>${br(q.tr)}</small>` : ''}` : '';
  scenes.forEach((e, k) => e.classList.toggle('on', k === i));
  navb.forEach((e, k) => e.setAttribute('aria-current', k === i ? 'true' : 'false'));
}
setFilm(0);
// 첫 화면에서 아래로 스크롤하면 바로 01 상위 페이지로
let jumping = false;
const toFirst = () => { if (jumping) return; jumping = true; const t = document.querySelector('.film .up'); if (t) window.scrollTo({top: t.getBoundingClientRect().top + scrollY, behavior: 'smooth'}); setTimeout(() => { jumping = false; }, 900); };
const atHero = () => scrollY < innerHeight * .5;
let lock = false;
const advance = () => { if (lock) return; if (!hero.classList.contains('open')) { lock = true; open(); setTimeout(() => { lock = false; }, 1200); } else toFirst(); };
addEventListener('wheel', e => { if (atHero() && e.deltaY > 0) { e.preventDefault(); advance(); } }, {passive: false});
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive: true});
addEventListener('touchmove', e => { if (ty !== null && atHero() && ty - e.touches[0].clientY > 24) { e.preventDefault(); ty = null; advance(); } }, {passive: false});
addEventListener('keydown', e => { if (atHero() && ['ArrowDown', 'PageDown', ' '].includes(e.key) && !$('lb').classList.contains('open')) { e.preventDefault(); advance(); } });
// 시간이 지나면 저절로: 제목 → 패널이 걷힘 → 영화 다섯 편이 차례로 (컬러칩이 들어왔다 나간다)
const HOLD = 2600, OUTT = 900;
let cur = 0, timer = null;
const slide = (x, now) => chips.forEach((c, i) => { const k = i; c.style.transition = now ? 'none' : `transform 1.23s var(--expo) ${(k * .067).toFixed(3)}s`; c.style.transform = `translate3d(${x}vw,0,0)`; });
function show(i){ slide(60, true); void chips[0].offsetWidth; setFilm(i); requestAnimationFrame(() => { slide(0); hcap.style.opacity = 1; }); }
function next(i){ clearTimeout(timer); hcap.style.opacity = 0; slide(60); timer = setTimeout(() => { cur = (i ?? cur + 1) % NF; show(cur); timer = setTimeout(next, HOLD); }, OUTT); }
function open(){ if (hero.classList.contains('open')) return; hero.classList.add('open'); timer = setTimeout(() => { show(0); timer = setTimeout(next, HOLD); }, 650); }
$('hnav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !hero.classList.contains('open')) return; next(+b.dataset.i); });
function intro(){ requestAnimationFrame(() => requestAnimationFrame(() => { hero.classList.add('go'); if (still) open(); })); }
const hd = $('hd');


// ── 영화마다 두 페이지: 상위(색 그라데이션 · 제목 · 줄거리 · 정보 · 포스터) / 하위(장면 · 밝기별 색 · MAIN 컬러 원 · 스펙트럼) ──
const mid = (a, d) => a[Math.floor(a.length / 2)] || {hex: d};
$('list').innerHTML = F.map((f, i) => {
  const T = tone(f), p = pt(f);
  const g1 = mid(T.dark, '#141414').hex;
  const g0 = [...T.light, ...T.medium, ...T.dark, ...T.spectrum, ...(f.main || []), ...(f.accent || [])].map(c => c.hex).sort((a, b) => lum(a) - lum(b))[0] || '#0e0e0d';
  let g2 = mid(T.medium, g1).hex; if (lum(g2) > .22) g2 = (T.dark[T.dark.length - 1] || {hex: g1}).hex;
  const sw = (c, j, step) => `<button style="background:${esc(c.hex)};transition-delay:${j * step}ms" data-hex="${esc(c.hex)}" data-p="${c.p ?? ''}" title="${esc(c.hex)} · 누르면 복사" aria-label="${esc(c.hex)} 복사"></button>`;
  const band = (label, arr) => `<div><span class="k">${label}</span><div class="sws">${arr.map((c, j) => sw(c, j, 55)).join('')}</div></div>`;
  const cast = (f.accent || []).map((m, j) => `<button class="pti" data-hex="${esc(m.hex)}" data-p="${m.p}" title="${esc(m.hex)} · 누르면 복사" style="background:${esc(m.hex)};color:${inkOn(m.hex)};transition-delay:${j * 90}ms"><b>${esc(m.hex.toUpperCase())}</b><small>${pc(m.p, 1)} · Point</small></button>`).join('');
  const tile = (c, j, n) => `<button class="tile" data-hex="${esc(c.hex)}" data-p="${c.p ?? ''}" title="${esc(c.hex)} · 누르면 복사" style="transition-delay:${(.12 + j * .05).toFixed(2)}s"><i style="background:${esc(c.hex)}"><em style="color:${inkOn(c.hex)}">${pad2(n)}</em></i><b>${esc(c.hex.toUpperCase())}</b></button>`;
  const grid = (arr, cols, ar) => `<div class="grid" style="--c:${cols};--ar:${ar}">${arr.map((c, j) => tile(c, j, j + 1)).join('')}</div>`;
  const bars = `<div class="bars">${(f.accent || []).map((m, j) => `<button class="bar" data-hex="${esc(m.hex)}" data-p="${m.p}" title="${esc(m.hex)} · 누르면 복사" style="background:${esc(m.hex)};color:${inkOn(m.hex)};transition-delay:${(.12 + j * .08).toFixed(2)}s"><b>${esc(m.hex.toUpperCase())}</b><small>${pc(m.p, 1)} · 화면 면적</small></button>`).join('') || '<span class="mono" style="opacity:.6">—</span>'}</div>`;
  const n = a => pad2(a.length) + ' colors';
  const steps = [
    {title: 'Light', sub: n(T.light) + ' · 밝은 구간', text: '장면을 밝기에 따라 세 구간으로 나눴을 때, 가장 밝은 구간에서 뽑은 색입니다.', body: grid(T.light, 4, 1)},
    {title: 'Medium', sub: n(T.medium) + ' · 중간 구간', text: '중간 밝기 구간에서 뽑은 색입니다. 장면의 분위기를 가장 넓게 받치는 색들이 모입니다.', body: grid(T.medium, 4, 1)},
    {title: 'Dark', sub: n(T.dark) + ' · 어두운 구간', text: '가장 어두운 구간에서 뽑은 색입니다. 그림자와 배경이 이 구간에 담깁니다.', body: grid(T.dark, 4, 1)},
    {title: 'Point', sub: n(f.accent || []) + ' · 포인트 컬러', text: '화면에서 차지하는 면적은 작지만 눈에 띄는 색입니다. 막대 오른쪽 숫자가 화면에서 차지한 비율입니다.', body: bars},
    {title: 'General\nSpectrum', sub: n(T.spectrum) + ' · 전체', text: '장면 전체에서 고르게 뽑은 스무 색입니다. 밝은 쪽에서 어두운 쪽으로 이어집니다.', body: grid(T.spectrum, 5, 1.5)},
  ];
  const dec = f.year ? Math.floor(+f.year / 10) * 10 + 's' : '—', age = f.year ? NOW - +f.year : null;
  return `<section class="film" id="f${esc(f.no)}" data-i="${i}">
  <div class="pg up" style="--g1:${esc(g1)};--g2:${esc(g2)}">
    <div class="upl">
      <div class="lab mono"><span>${esc(f.no)} / ${pad2(F.length)}</span><span>${esc(dash(f.year))}</span></div>
      <h2>${words(nm(f))}</h2>
      ${f.titleEn ? `<p class="en">${esc(f.titleEn)}</p>` : ''}
      ${f.scene ? `<span class="k">Storyline</span><p class="story">${br(f.scene)}</p>` : ''}
      ${f.reason ? `<span class="k">Why this film</span><p class="story">${br(f.reason)}</p>` : ''}
      <dl class="meta">
        <div><dt class="k">Director</dt><dd>${esc(dash(f.director))}</dd></div>
        <div><dt class="k">Year</dt><dd>${esc(dash(f.year))} · ${esc(dec)}</dd></div>
        <div><dt class="k">Released</dt><dd>${age === null ? '—' : (age ? age + ' yrs ago' : 'this year')}</dd></div>
        <div><dt class="k">Point color</dt><dd><i style="background:${esc(p)}"></i>${esc(p.toUpperCase())}</dd></div>
      </dl>
    </div>
    ${f.poster ? `<figure class="upr"><img src="${esc(f.poster)}" alt="${esc(nm(f))} 포스터" onerror="this.parentNode.remove()"></figure>` : ''}
  </div>
  <div class="pg dn seq" style="--g0:${esc(g0)};height:${steps.length * 100}vh">
    <div class="stage">${steps.map((s, k) => `<div class="st${s.flip ? ' flip' : ''}" data-k="${k}">
      <div class="tx"><span class="lab2">${esc(f.no)} · ${esc(nm(f))}</span><h3>${s.title}</h3><span class="sub">${esc(s.sub)}</span><p>${esc(s.text)}</p>${k === steps.length - 1 ? `<button class="btn" data-lb="${i}">↗ 배색 카드 크게 보기</button>` : ''}</div>
      ${s.body}
      <span class="pgn l">${esc(f.no)} / ${pad2(F.length)}</span><span class="pgn r">${pad2(k + 1)} / ${pad2(steps.length)}</span>
    </div>`).join('')}</div>
    ${steps.map((_, k) => `<div class="snap" style="top:${k * 100}vh"></div>`).join('')}

// 값 읽기 · 복사
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-hex]'); if (!b) return; const r = b.closest('.tonebox,.pts'); const rd = (b.closest('.r') || document).querySelector('[data-read]'); if (!rd) return; rd.innerHTML = `<i style="background:${b.dataset.hex}"></i><b>${b.dataset.hex}</b><span>${b.dataset.p !== '' && b.dataset.p != null ? pc(b.dataset.p, 1) : ''}</span>`; });
document.addEventListener('click', e => { const b = e.target.closest('[data-hex]'); if (!b) return; (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.hex) : Promise.reject()).then(() => toast(b.dataset.hex + ' 복사됨'), () => toast(b.dataset.hex)); });

// 나타나기 · 머리 색
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold: .18});
document.querySelectorAll('.film, .pg').forEach(el => io.observe(el));
// 색 묶음 화면: 스크롤 위치로 지금 보여 줄 묶음을 고른다
const seqs = [...document.querySelectorAll('.seq')].map(el => ({el, st: [...el.querySelectorAll('.st')], cur: -1}));
function seqStep(){
  seqs.forEach(s => {
    const r = s.el.getBoundingClientRect(), H = innerHeight;
    const k = Math.min(s.st.length - 1, Math.max(0, Math.floor(-r.top / H + .5)));
    if (k === s.cur) return; s.cur = k;
    s.st.forEach((e, j) => { e.classList.toggle('on', j === k); e.classList.toggle('past', j < k); });
  });
}
addEventListener('scroll', seqStep, {passive: true}); addEventListener('resize', seqStep); seqStep();
function head(){
  const y = 28; let dark = false;
  const hr = hero.getBoundingClientRect();
  // 히어로: 흰 패널이 헤더 아래에 남아 있는 동안은 밝은 바탕, 걷힌 뒤엔 장면(어두운 바탕)
  if (hr.top <= y && hr.bottom > y) dark = true;
  document.querySelectorAll('.screen, .pg').forEach(sc => { const r = sc.getBoundingClientRect(); if (r.top <= y && r.bottom > y) dark = true; });
  hd.classList.toggle('dark', dark);
  let on = -1; document.querySelectorAll('.film').forEach((fm, i) => { const r = fm.getBoundingClientRect(); if (r.top <= innerHeight * .5 && r.bottom > innerHeight * .5) on = i; });
  document.querySelectorAll('#gnb a').forEach((a, i) => a.setAttribute('aria-current', i === on ? 'true' : 'false'));
}
addEventListener('scroll', head, {passive: true});
